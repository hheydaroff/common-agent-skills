<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Codebase Knowledge Graph</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d1117; color: #c9d1d9; overflow: hidden; height: 100vh; }
#app { display: flex; height: 100vh; }
#sidebar { width: 320px; background: #161b22; border-right: 1px solid #30363d; display: flex; flex-direction: column; overflow: hidden; }
#sidebar.collapsed { width: 0; min-width: 0; border: none; }
#graph-container { flex: 1; position: relative; }
svg { width: 100%; height: 100%; }
.header { padding: 16px; border-bottom: 1px solid #30363d; }
.header h1 { font-size: 14px; font-weight: 600; color: #f0f6fc; margin-bottom: 4px; }
.header p { font-size: 12px; color: #8b949e; }
.search-box { padding: 12px 16px; border-bottom: 1px solid #30363d; }
.search-box input { width: 100%; padding: 8px 12px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #c9d1d9; font-size: 13px; outline: none; }
.search-box input:focus { border-color: #58a6ff; }
.panel { flex: 1; overflow-y: auto; padding: 12px 16px; }
.section { margin-bottom: 16px; }
.section-title { font-size: 11px; font-weight: 600; text-transform: uppercase; color: #8b949e; margin-bottom: 8px; letter-spacing: 0.5px; }
.layer-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 4px; cursor: pointer; font-size: 13px; margin-bottom: 2px; }
.layer-item:hover { background: #1c2128; }
.layer-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.layer-count { margin-left: auto; color: #8b949e; font-size: 11px; }
.node-detail { display: none; }
.node-detail.active { display: block; }
.node-detail h3 { font-size: 14px; color: #f0f6fc; margin-bottom: 8px; }
.node-detail .type-badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 500; margin-bottom: 8px; }
.node-detail .summary { font-size: 13px; line-height: 1.5; margin-bottom: 12px; }
.node-detail .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 12px; }
.node-detail .tag { padding: 2px 8px; background: #1c2128; border-radius: 4px; font-size: 11px; color: #8b949e; }
.node-detail .connections { font-size: 12px; }
.node-detail .connection { padding: 4px 0; color: #8b949e; cursor: pointer; }
.node-detail .connection:hover { color: #58a6ff; }
.tour-step { padding: 10px 12px; background: #1c2128; border-radius: 6px; margin-bottom: 8px; cursor: pointer; }
.tour-step:hover { background: #22272e; }
.tour-step .step-num { font-size: 11px; color: #58a6ff; font-weight: 600; }
.tour-step .step-title { font-size: 13px; color: #f0f6fc; margin-top: 2px; }
.tour-step .step-desc { font-size: 12px; color: #8b949e; margin-top: 4px; line-height: 1.4; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
.stat { background: #1c2128; padding: 10px; border-radius: 6px; text-align: center; }
.stat-value { font-size: 18px; font-weight: 700; color: #f0f6fc; }
.stat-label { font-size: 11px; color: #8b949e; margin-top: 2px; }
.controls { position: absolute; top: 12px; right: 12px; display: flex; gap: 8px; }
.btn { padding: 6px 12px; background: #21262d; border: 1px solid #30363d; border-radius: 6px; color: #c9d1d9; font-size: 12px; cursor: pointer; }
.btn:hover { background: #30363d; }
.tooltip { position: absolute; padding: 8px 12px; background: #1c2128; border: 1px solid #30363d; border-radius: 6px; font-size: 12px; pointer-events: none; opacity: 0; transition: opacity 0.15s; max-width: 300px; z-index: 1000; }
.tooltip.visible { opacity: 1; }
#loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #0d1117; z-index: 100; }
#loading.hidden { display: none; }
.tab-bar { display: flex; border-bottom: 1px solid #30363d; }
.tab { flex: 1; padding: 10px; text-align: center; font-size: 12px; cursor: pointer; color: #8b949e; border-bottom: 2px solid transparent; }
.tab.active { color: #f0f6fc; border-bottom-color: #58a6ff; }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div class="header">
      <h1 id="project-name">Loading...</h1>
      <p id="project-desc"></p>
    </div>
    <div class="search-box">
      <input type="text" id="search" placeholder="Search nodes..." />
    </div>
    <div class="tab-bar">
      <div class="tab active" data-tab="layers">Layers</div>
      <div class="tab" data-tab="tour">Tour</div>
      <div class="tab" data-tab="detail">Detail</div>
    </div>
    <div class="panel" id="panel-layers">
      <div class="stats" id="stats"></div>
      <div class="section" id="layers-list"></div>
    </div>
    <div class="panel" id="panel-tour" style="display:none">
      <div class="section" id="tour-list"></div>
    </div>
    <div class="panel" id="panel-detail" style="display:none">
      <div class="node-detail active" id="node-detail">
        <p style="color:#8b949e; font-size:13px;">Click a node to see details</p>
      </div>
    </div>
  </div>
  <div id="graph-container">
    <svg id="graph"></svg>
    <div class="controls">
      <button class="btn" id="btn-reset">Reset View</button>
      <button class="btn" id="btn-sidebar">Toggle Sidebar</button>
    </div>
    <div class="tooltip" id="tooltip"></div>
    <div id="loading">
      <p>Loading knowledge graph...</p>
    </div>
  </div>
</div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
const LAYER_COLORS = [
  '#58a6ff', '#3fb950', '#d2a8ff', '#f78166',
  '#79c0ff', '#56d364', '#d8b4fe', '#ffa657',
  '#a5d6ff', '#7ee787', '#e2c5ff', '#ffc680'
];

const TYPE_SHAPES = {
  file: 'circle', function: 'diamond', class: 'square',
  module: 'hexagon', config: 'triangle', document: 'triangle',
  service: 'hexagon', endpoint: 'star', pipeline: 'triangle'
};

let graph, simulation, svg, g, link, node, zoom;
let nodeElements, linkElements;
let selectedNode = null;
let layerColorMap = {};

async function loadGraph() {
  try {
    const resp = await fetch('knowledge-graph.json');
    if (!resp.ok) throw new Error('knowledge-graph.json not found');
    graph = await resp.json();
    init();
  } catch (e) {
    document.getElementById('loading').innerHTML =
      `<div style="text-align:center"><p style="color:#f85149;margin-bottom:8px;">Failed to load graph</p><p style="color:#8b949e;font-size:13px;">${e.message}</p><p style="color:#8b949e;font-size:12px;margin-top:12px;">Make sure knowledge-graph.json is in the same directory.<br>If opening locally, use: <code>python3 -m http.server 8080</code></p></div>`;
  }
}

function init() {
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('project-name').textContent = graph.project?.name || 'Codebase';
  document.getElementById('project-desc').textContent = graph.project?.description || '';

  // Build layer color map
  (graph.layers || []).forEach((layer, i) => {
    layerColorMap[layer.id] = LAYER_COLORS[i % LAYER_COLORS.length];
    (layer.nodeIds || []).forEach(nid => { layerColorMap[nid] = LAYER_COLORS[i % LAYER_COLORS.length]; });
  });

  renderStats();
  renderLayers();
  renderTour();
  renderGraph();
  setupSearch();
  setupTabs();
  setupControls();
}

function renderStats() {
  const s = document.getElementById('stats');
  const fileNodes = graph.nodes.filter(n => ['file','config','document','service','pipeline','endpoint'].includes(n.type));
  s.innerHTML = `
    <div class="stat"><div class="stat-value">${graph.nodes.length}</div><div class="stat-label">Nodes</div></div>
    <div class="stat"><div class="stat-value">${graph.edges.length}</div><div class="stat-label">Edges</div></div>
    <div class="stat"><div class="stat-value">${(graph.layers||[]).length}</div><div class="stat-label">Layers</div></div>
    <div class="stat"><div class="stat-value">${(graph.tour||[]).length}</div><div class="stat-label">Tour Steps</div></div>`;
}

function renderLayers() {
  const el = document.getElementById('layers-list');
  el.innerHTML = '<div class="section-title">Architecture Layers</div>' +
    (graph.layers || []).map((layer, i) => `
      <div class="layer-item" data-layer="${layer.id}">
        <span class="layer-dot" style="background:${LAYER_COLORS[i % LAYER_COLORS.length]}"></span>
        <span>${layer.name}</span>
        <span class="layer-count">${(layer.nodeIds||[]).length}</span>
      </div>`).join('');

  el.querySelectorAll('.layer-item').forEach(item => {
    item.addEventListener('click', () => highlightLayer(item.dataset.layer));
  });
}

function renderTour() {
  const el = document.getElementById('tour-list');
  const steps = (graph.tour || []).sort((a, b) => a.order - b.order);
  el.innerHTML = '<div class="section-title">Guided Tour</div>' +
    steps.map(step => `
      <div class="tour-step" data-nodes='${JSON.stringify(step.nodeIds||[])}'>
        <div class="step-num">Step ${step.order}</div>
        <div class="step-title">${step.title}</div>
        <div class="step-desc">${step.description}</div>
      </div>`).join('');

  el.querySelectorAll('.tour-step').forEach(item => {
    item.addEventListener('click', () => {
      const nodeIds = JSON.parse(item.dataset.nodes);
      highlightNodes(nodeIds);
    });
  });
}

function renderGraph() {
  svg = d3.select('#graph');
  const width = svg.node().clientWidth;
  const height = svg.node().clientHeight;

  // Only show file-level nodes by default (avoid clutter with thousands of functions)
  const fileLevelTypes = new Set(['file', 'config', 'document', 'service', 'pipeline', 'endpoint', 'module', 'schema', 'resource', 'table']);
  const visibleNodes = graph.nodes.filter(n => fileLevelTypes.has(n.type));
  const visibleIds = new Set(visibleNodes.map(n => n.id));
  const visibleEdges = graph.edges.filter(e => visibleIds.has(e.source) && visibleIds.has(e.target));

  g = svg.append('g');

  zoom = d3.zoom().scaleExtent([0.1, 4]).on('zoom', e => g.attr('transform', e.transform));
  svg.call(zoom);

  simulation = d3.forceSimulation(visibleNodes)
    .force('link', d3.forceLink(visibleEdges).id(d => d.id).distance(80).strength(0.3))
    .force('charge', d3.forceManyBody().strength(-200))
    .force('center', d3.forceCenter(width / 2, height / 2))
    .force('collision', d3.forceCollide().radius(20));

  linkElements = g.append('g').attr('class', 'links')
    .selectAll('line').data(visibleEdges).join('line')
    .attr('stroke', '#30363d').attr('stroke-width', 1).attr('stroke-opacity', 0.6);

  nodeElements = g.append('g').attr('class', 'nodes')
    .selectAll('circle').data(visibleNodes).join('circle')
    .attr('r', d => d.type === 'module' ? 10 : 7)
    .attr('fill', d => layerColorMap[d.id] || '#8b949e')
    .attr('stroke', '#0d1117').attr('stroke-width', 1.5)
    .attr('cursor', 'pointer')
    .call(d3.drag()
      .on('start', dragStart)
      .on('drag', dragging)
      .on('end', dragEnd));

  nodeElements.on('click', (e, d) => selectNode(d))
    .on('mouseenter', (e, d) => showTooltip(e, d))
    .on('mouseleave', hideTooltip);

  // Labels for larger nodes
  g.append('g').attr('class', 'labels')
    .selectAll('text').data(visibleNodes).join('text')
    .text(d => d.name.length > 20 ? d.name.slice(0, 18) + '…' : d.name)
    .attr('font-size', 9).attr('fill', '#8b949e')
    .attr('text-anchor', 'middle').attr('dy', 18)
    .attr('pointer-events', 'none');

  simulation.on('tick', () => {
    linkElements
      .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
      .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    nodeElements.attr('cx', d => d.x).attr('cy', d => d.y);
    g.selectAll('.labels text').attr('x', d => d.x).attr('y', d => d.y);
  });
}

function selectNode(d) {
  selectedNode = d;
  nodeElements.attr('opacity', n => {
    const connected = graph.edges.some(e =>
      (e.source.id || e.source) === d.id && (e.target.id || e.target) === n.id ||
      (e.target.id || e.target) === d.id && (e.source.id || e.source) === n.id);
    return n.id === d.id || connected ? 1 : 0.2;
  });
  linkElements.attr('stroke-opacity', e =>
    (e.source.id || e.source) === d.id || (e.target.id || e.target) === d.id ? 0.8 : 0.1);

  // Show detail tab
  showTab('detail');
  const detail = document.getElementById('node-detail');
  const connections = graph.edges.filter(e =>
    (e.source.id || e.source) === d.id || (e.target.id || e.target) === d.id);
  const color = layerColorMap[d.id] || '#8b949e';
  detail.innerHTML = `
    <h3>${d.name}</h3>
    <span class="type-badge" style="background:${color}22;color:${color}">${d.type}</span>
    ${d.filePath ? `<p style="font-size:11px;color:#8b949e;margin-bottom:8px;">${d.filePath}</p>` : ''}
    <p class="summary">${d.summary || 'No summary'}</p>
    <div class="tags">${(d.tags||[]).map(t => `<span class="tag">${t}</span>`).join('')}</div>
    <div class="connections">
      <div class="section-title">Connections (${connections.length})</div>
      ${connections.slice(0, 20).map(e => {
        const otherId = (e.source.id || e.source) === d.id ? (e.target.id || e.target) : (e.source.id || e.source);
        const other = graph.nodes.find(n => n.id === otherId);
        const dir = (e.source.id || e.source) === d.id ? '→' : '←';
        return `<div class="connection" data-id="${otherId}">${dir} ${other?.name || otherId} <span style="color:#58a6ff">(${e.type})</span></div>`;
      }).join('')}
    </div>`;

  detail.querySelectorAll('.connection').forEach(c => {
    c.addEventListener('click', () => {
      const target = graph.nodes.find(n => n.id === c.dataset.id);
      if (target) selectNode(target);
    });
  });
}

function highlightLayer(layerId) {
  const layer = graph.layers.find(l => l.id === layerId);
  if (!layer) return;
  highlightNodes(layer.nodeIds || []);
}

function highlightNodes(nodeIds) {
  const ids = new Set(nodeIds);
  nodeElements.attr('opacity', n => ids.has(n.id) ? 1 : 0.15);
  linkElements.attr('stroke-opacity', e => {
    const sid = e.source.id || e.source;
    const tid = e.target.id || e.target;
    return ids.has(sid) && ids.has(tid) ? 0.8 : 0.05;
  });

  // Zoom to fit highlighted nodes
  const highlighted = graph.nodes.filter(n => ids.has(n.id) && n.x != null);
  if (highlighted.length) {
    const xs = highlighted.map(n => n.x), ys = highlighted.map(n => n.y);
    const x0 = Math.min(...xs) - 50, x1 = Math.max(...xs) + 50;
    const y0 = Math.min(...ys) - 50, y1 = Math.max(...ys) + 50;
    const w = svg.node().clientWidth, h = svg.node().clientHeight;
    const scale = Math.min(w / (x1 - x0), h / (y1 - y0), 2);
    const tx = w / 2 - scale * (x0 + x1) / 2;
    const ty = h / 2 - scale * (y0 + y1) / 2;
    svg.transition().duration(750).call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
  }
}

function showTooltip(event, d) {
  const tip = document.getElementById('tooltip');
  tip.innerHTML = `<strong>${d.name}</strong><br><span style="color:#8b949e">${d.summary || d.type}</span>`;
  tip.style.left = (event.pageX + 12) + 'px';
  tip.style.top = (event.pageY - 12) + 'px';
  tip.classList.add('visible');
}

function hideTooltip() { document.getElementById('tooltip').classList.remove('visible'); }

function setupSearch() {
  const input = document.getElementById('search');
  input.addEventListener('input', () => {
    const q = input.value.toLowerCase();
    if (!q) { nodeElements.attr('opacity', 1); linkElements.attr('stroke-opacity', 0.6); return; }
    nodeElements.attr('opacity', d =>
      d.name.toLowerCase().includes(q) || (d.summary||'').toLowerCase().includes(q) ||
      (d.tags||[]).some(t => t.toLowerCase().includes(q)) ? 1 : 0.1);
    linkElements.attr('stroke-opacity', 0.1);
  });
}

function setupTabs() {
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => showTab(tab.dataset.tab));
  });
}

function showTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  ['layers', 'tour', 'detail'].forEach(t => {
    document.getElementById(`panel-${t}`).style.display = t === name ? 'block' : 'none';
  });
}

function setupControls() {
  document.getElementById('btn-reset').addEventListener('click', () => {
    nodeElements.attr('opacity', 1);
    linkElements.attr('stroke-opacity', 0.6);
    svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity);
  });
  document.getElementById('btn-sidebar').addEventListener('click', () => {
    document.getElementById('sidebar').classList.toggle('collapsed');
  });
}

function dragStart(e, d) { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; }
function dragging(e, d) { d.fx = e.x; d.fy = e.y; }
function dragEnd(e, d) { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }

loadGraph();
</script>
</body>
</html>
